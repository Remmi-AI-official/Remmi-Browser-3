name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'App Version Name (e.g. 1.0.3)'
        required: true
        default: '1.0.3'
      version_code:
        description: 'App Version Code for Play Store (e.g. 4)'
        required: true
        default: '4'
      release_title:
        description: 'Release Title'
        required: false
        default: 'Remmi Browser Release'
      release_notes:
        description: 'Release Notes (Changelog)'
        required: false
        default: 'Bug fixes and performance improvements.'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission
        run: chmod +x ./gradlew

      - name: Verify Gradle / Java
        run: |
          java -version
          ./gradlew --version

      - name: Verify Gradle Wrapper
        shell: bash
        run: |
          grep '^distributionUrl=' gradle/wrapper/gradle-wrapper.properties

      - name: Apply Version Configuration
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V_NAME="${{ github.event.inputs.version_name }}"
            V_CODE="${{ github.event.inputs.version_code }}"
            echo "Configuring Version: Name=$V_NAME, Code=$V_CODE"
            sed -i "s/versionCode = [0-9]*/versionCode = $V_CODE/g" app/build.gradle.kts
            sed -i "s/versionName = \".*\"/versionName = \"$V_NAME\"/g" app/build.gradle.kts
          fi

      - name: Setup Keystore
        id: setup-keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_BASE64:-}" ] && [ -n "${STORE_PASSWORD:-}" ] && [ -n "${KEY_ALIAS:-}" ] && [ -n "${KEY_PASSWORD:-}" ]; then
            echo "Using production release keystore from secrets..."
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release.keystore
            chmod 600 release.keystore
            echo "KEYSTORE_PATH=${{ github.workspace }}/release.keystore" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "No production signing secrets found. Generating release keystore..."
            keytool -genkey -v -keystore release.keystore -alias remmibrowser -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass remmibrowser -keypass remmibrowser -dname "CN=Remmi Browser, OU=Mobile, O=Remmi, L=City, S=State, C=US"
            chmod 600 release.keystore
            echo "KEYSTORE_PATH=${{ github.workspace }}/release.keystore" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=remmibrowser" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=remmibrowser" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=remmibrowser" >> "$GITHUB_ENV"
          fi

      - name: Run Release Checks
        run: |
          ./gradlew :app:testReleaseUnitTest :app:lintRelease

      - name: Build Release APK & AAB
        run: |
          ./gradlew :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Verify and Collect Artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-output
          
          # Copy APKs
          find app/build/outputs/apk/release/ -type f -name "*.apk" -exec cp {} release-output/ \;
          # Copy AAB (Bundle)
          find app/build/outputs/bundle/release/ -type f -name "*.aab" -exec cp {} release-output/ \;

          cd release-output
          ls -la
          
          # Ensure at least one APK and one AAB exist
          count_apk=$(ls -1 *.apk 2>/dev/null | wc -l)
          count_aab=$(ls -1 *.aab 2>/dev/null | wc -l)
          if [ "$count_apk" -eq 0 ] || [ "$count_aab" -eq 0 ]; then
            echo "ERROR: Artifacts missing. Found $count_apk APKs and $count_aab AABs"
            exit 1
          fi

      - name: Compute SHA256
        shell: bash
        run: |
          set -euo pipefail
          cd release-output
          sha256sum *.apk *.aab > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Verify APK Signature
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          test -n "$APKSIGNER"
          for apk in release-output/*.apk; do
            echo "Verifying $apk..."
            "$APKSIGNER" verify --verbose "$apk"
          done

      - name: Prepare Release Metadata
        id: release_meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V_NAME="${{ github.event.inputs.version_name }}"
            TITLE="${{ github.event.inputs.release_title }} (v${V_NAME})"
            TAG="v${V_NAME}"
            NOTES="${{ github.event.inputs.release_notes }}"
          else
            TAG="${{ github.ref_name }}"
            TITLE="Remmi Browser ${{ github.ref_name }}"
            NOTES="Automated release for tag ${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          echo "notes=$NOTES" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release and Upload APK / AAB
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: ${{ steps.release_meta.outputs.title }}
          body: ${{ steps.release_meta.outputs.notes }}
          draft: false
          prerelease: false
          files: |
            release-output/*.apk
            release-output/*.aab
            release-output/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
