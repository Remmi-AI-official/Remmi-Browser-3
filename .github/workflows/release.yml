name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'App Version Name (e.g. 1.0.3)'
        required: true
        default: '1.0.3'
      version_code:
        description: 'App Version Code for Play Store (e.g. 4)'
        required: true
        default: '4'
      release_title:
        description: 'Release Title'
        required: false
        default: 'Remmi Browser Release'
      release_notes:
        description: 'Release Notes (Changelog)'
        required: false
        default: 'Bug fixes and performance improvements.'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Verify Toolchain (Gradle 9.3.1 & JDK 17)
        shell: bash
        run: |
          set -euo pipefail
          echo "Verifying JDK version..."
          java -version
          JAVA_VER=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | cut -d'.' -f1)
          if [ "$JAVA_VER" != "17" ]; then
            echo "::error::JDK version must be 17, but detected '$JAVA_VER'"
            exit 1
          fi

          echo "Verifying Gradle version with retry resilience..."
          for i in 1 2 3 4 5; do
            if ./gradlew --version > /tmp/gradle_ver_out.txt 2>&1; then
              cat /tmp/gradle_ver_out.txt
              break
            fi
            echo "Gradle download/verification attempt $i failed. Retrying in 5 seconds..."
            cat /tmp/gradle_ver_out.txt || true
            sleep 5
          done
          
          GRADLE_VER=$(cat /tmp/gradle_ver_out.txt | awk '/^Gradle / {print $2}')
          if [ "$GRADLE_VER" != "9.3.1" ]; then
            echo "::error::Gradle version must be 9.3.1, but detected '$GRADLE_VER'"
            exit 1
          fi

      - name: Validate Release Inputs & Resolve Version
        id: resolve_version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_V_NAME: ${{ inputs.version_name }}
          INPUT_V_CODE: ${{ inputs.version_code }}
          INPUT_TITLE: ${{ inputs.release_title }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if ! [[ "$INPUT_V_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Invalid versionName '$INPUT_V_NAME'. Must match pattern: ^[0-9]+\.[0-9]+\.[0-9]+$"
              exit 1
            fi
            if ! [[ "$INPUT_V_CODE" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::Invalid versionCode '$INPUT_V_CODE'. Must be a positive integer."
              exit 1
            fi

            RELEASE_TAG="v${INPUT_V_NAME}"
            VERSION_NAME="$INPUT_V_NAME"
            VERSION_CODE="$INPUT_V_CODE"
            RELEASE_TITLE="${INPUT_TITLE:-Remmi Browser Release} (v${VERSION_NAME})"
          else
            if ! [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Push tag '$REF_NAME' is invalid. Must match pattern: ^v[0-9]+\.[0-9]+\.[0-9]+$"
              exit 1
            fi

            test -f release-version.properties

            VERSION_NAME="$(grep '^versionName=' release-version.properties | cut -d'=' -f2-)"
            VERSION_CODE="$(grep '^versionCode=' release-version.properties | cut -d'=' -f2-)"

            if ! [[ "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::Invalid versionCode '$VERSION_CODE' in release-version.properties"
              exit 1
            fi

            RELEASE_TAG="$REF_NAME"
            RELEASE_TITLE="Remmi Browser ${RELEASE_TAG}"
          fi

          # Consistency check: tag must match versionName
          EXPECTED_TAG="v${VERSION_NAME}"
          if [ "$RELEASE_TAG" != "$EXPECTED_TAG" ]; then
            echo "::error::Release version mismatch: tag '$RELEASE_TAG' does not correspond to versionName '$VERSION_NAME' (expected '$EXPECTED_TAG')"
            exit 1
          fi

          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "release_title=$RELEASE_TITLE" >> "$GITHUB_OUTPUT"

      - name: Prepare Release Notes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_NOTES: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$INPUT_NOTES" ]; then
            printf '%s\n' "$INPUT_NOTES" > release-notes.md
          else
            printf 'Automated production release for %s\n' "$REF_NAME" > release-notes.md
          fi

      - name: Verify Production Signing Secrets
        shell: bash
        env:
          KEYSTORE_B64_A: ${{ secrets.REMMI_RELEASE_KEYSTORE_B64 }}
          KEYSTORE_B64_B: ${{ secrets.KEYSTORE_BASE64 }}
          PASS_A: ${{ secrets.REMMI_RELEASE_STORE_PASSWORD }}
          PASS_B: ${{ secrets.STORE_PASSWORD }}
          KEY_PASS_A: ${{ secrets.REMMI_RELEASE_KEY_PASSWORD }}
          KEY_PASS_B: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64_A:-}${KEYSTORE_B64_B:-}" ] || \
             [ -z "${PASS_A:-}${PASS_B:-}${KEY_PASS_A:-}${KEY_PASS_B:-}" ]; then
            echo "::error::Production signing secrets are missing! Please set in GitHub Repository Secrets:"
            echo "- REMMI_RELEASE_KEYSTORE_B64 (or KEYSTORE_BASE64)"
            echo "- REMMI_RELEASE_STORE_PASSWORD (or STORE_PASSWORD)"
            echo "- REMMI_RELEASE_KEY_ALIAS (or KEY_ALIAS)"
            echo "- REMMI_RELEASE_KEY_PASSWORD (or KEY_PASSWORD)"
            echo "Automatic signing-key generation is disabled."
            exit 1
          fi

      - name: Setup Keystore
        shell: bash
        env:
          KEYSTORE_B64_A: ${{ secrets.REMMI_RELEASE_KEYSTORE_B64 }}
          KEYSTORE_B64_B: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASS_A: ${{ secrets.REMMI_RELEASE_STORE_PASSWORD }}
          STORE_PASS_B: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS_A: ${{ secrets.REMMI_RELEASE_KEY_ALIAS }}
          KEY_ALIAS_B: ${{ secrets.KEY_ALIAS }}
          KEY_PASS_A: ${{ secrets.REMMI_RELEASE_KEY_PASSWORD }}
          KEY_PASS_B: ${{ secrets.KEY_PASSWORD }}
          WORKSPACE_PATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          
          # Collect password candidates
          declare -a PASS_CANDIDATES=()
          for p in "${STORE_PASS_B:-}" "${STORE_PASS_A:-}" "${KEY_PASS_B:-}" "${KEY_PASS_A:-}"; do
            clean_p=$(printf '%s' "$p" | tr -d '\r\n"')
            if [ -n "$clean_p" ]; then
              # Deduplicate
              found=0
              for existing in "${PASS_CANDIDATES[@]}"; do
                if [ "$existing" = "$clean_p" ]; then found=1; break; fi
              done
              if [ "$found" -eq 0 ]; then
                PASS_CANDIDATES+=("$clean_p")
              fi
            fi
          done

          echo "Found ${#PASS_CANDIDATES[@]} unique password candidate(s)."

          # Collect and test base64 candidates
          FOUND_KEYSTORE=0
          MATCHED_STORE_PASS=""
          
          declare -a B64_CANDIDATES=()
          for b64 in "${KEYSTORE_B64_B:-}" "${KEYSTORE_B64_A:-}"; do
            clean_b64=$(printf '%s' "$b64" | tr -d '\r\n "')
            if [ -n "$clean_b64" ]; then
              B64_CANDIDATES+=("$clean_b64")
            fi
          done

          echo "Found ${#B64_CANDIDATES[@]} keystore base64 payload(s)."

          cand_idx=0
          for clean_b64 in "${B64_CANDIDATES[@]}"; do
            cand_idx=$((cand_idx + 1))
            echo "Evaluating keystore payload #$cand_idx (length: ${#clean_b64} characters)..."
            
            rm -f candidate.keystore
            if ! printf '%s' "$clean_b64" | base64 -d -i > candidate.keystore 2>/dev/null; then
              printf '%s' "$clean_b64" | base64 --decode > candidate.keystore 2>/dev/null || true
            fi
            
            if [ ! -s candidate.keystore ]; then
              echo "Warning: Base64 decode resulted in an empty file for candidate #$cand_idx."
              continue
            fi

            pass_idx=0
            for p in "${PASS_CANDIDATES[@]}"; do
              pass_idx=$((pass_idx + 1))
              echo "Testing password candidate #$pass_idx (length: ${#p} chars)..."
              if keytool -list -keystore candidate.keystore -storepass "$p" >/dev/null 2>&1; then
                mv candidate.keystore release.keystore
                chmod 600 release.keystore
                MATCHED_STORE_PASS="$p"
                FOUND_KEYSTORE=1
                echo "Success: Unlocked keystore with password candidate #$pass_idx."
                break 2
              fi
            done
          done

          if [ "$FOUND_KEYSTORE" -ne 1 ]; then
            echo "::error::Could not unlock keystore with the provided store passwords."
            echo "Please ensure the GitHub secret KEYSTORE_BASE64 contains the full base64 string and STORE_PASSWORD is set to the matching password."
            exit 1
          fi

          echo "Keystore unlocked successfully."
          keytool -list -v -keystore release.keystore -storepass "$MATCHED_STORE_PASS"

          # Determine key alias
          TARGET_ALIAS=""
          for a in "${KEY_ALIAS_B:-}" "${KEY_ALIAS_A:-}" "remmi_release"; do
            clean_a=$(printf '%s' "$a" | tr -d '\r\n "')
            if [ -n "$clean_a" ] && keytool -list -keystore release.keystore -storepass "$MATCHED_STORE_PASS" -alias "$clean_a" >/dev/null 2>&1; then
              TARGET_ALIAS="$clean_a"
              break
            fi
          done

          if [ -z "$TARGET_ALIAS" ]; then
            TARGET_ALIAS=$(keytool -list -keystore release.keystore -storepass "$MATCHED_STORE_PASS" | grep -i 'PrivateKeyEntry' | head -n1 | cut -d',' -f1 | tr -d ' ')
          fi

          # Determine key password
          MATCHED_KEY_PASS=""
          for kp in "$MATCHED_STORE_PASS" "${KEY_PASS_B:-}" "${KEY_PASS_A:-}"; do
            clean_kp=$(printf '%s' "$kp" | tr -d '\r\n "')
            if [ -n "$clean_kp" ]; then
              if keytool -certreq -keystore release.keystore -storepass "$MATCHED_STORE_PASS" -alias "$TARGET_ALIAS" -keypass "$clean_kp" -file /dev/null >/dev/null 2>&1; then
                MATCHED_KEY_PASS="$clean_kp"
                break
              fi
            fi
          done

          if [ -z "$MATCHED_KEY_PASS" ]; then
            echo "::error::Could not decrypt key entry '$TARGET_ALIAS' with the provided key password."
            exit 1
          fi

          echo "Key alias '$TARGET_ALIAS' verified successfully."
          echo "KEYSTORE_PATH=${WORKSPACE_PATH}/release.keystore" >> "$GITHUB_ENV"
          echo "STORE_PASSWORD=$MATCHED_STORE_PASS" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$TARGET_ALIAS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$MATCHED_KEY_PASS" >> "$GITHUB_ENV"

      - name: Run Release Checks (Tests & Lint)
        env:
          V_NAME: ${{ steps.resolve_version.outputs.version_name }}
          V_CODE: ${{ steps.resolve_version.outputs.version_code }}
        run: |
          ./gradlew \
            -PversionName="$V_NAME" \
            -PversionCode="$V_CODE" \
            :app:testDebugUnitTest \
            :app:lintRelease

      - name: Build Release APK & AAB
        env:
          V_NAME: ${{ steps.resolve_version.outputs.version_name }}
          V_CODE: ${{ steps.resolve_version.outputs.version_code }}
        run: |
          ./gradlew \
            -PversionName="$V_NAME" \
            -PversionCode="$V_CODE" \
            :app:assembleRelease \
            :app:bundleRelease \
            --stacktrace

      - name: Verify and Collect Artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-output
          
          # Copy APKs
          find app/build/outputs/apk/release/ -type f -name "*.apk" -exec cp {} release-output/ \;
          # Copy AABs (Bundle)
          find app/build/outputs/bundle/release/ -type f -name "*.aab" -exec cp {} release-output/ \;

          cd release-output
          ls -la
          
          count_apk=$(ls -1 *.apk 2>/dev/null | wc -l)
          count_aab=$(ls -1 *.aab 2>/dev/null | wc -l)
          if [ "$count_apk" -eq 0 ] || [ "$count_aab" -eq 0 ]; then
            echo "::error::Release artifacts missing! Found $count_apk APKs and $count_aab AABs"
            exit 1
          fi

      - name: Compute SHA256 Checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-output
          sha256sum *.apk *.aab > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Verify APK Signature
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner tool not found in $ANDROID_HOME/build-tools"
            exit 1
          fi
          for apk in release-output/*.apk; do
            echo "Verifying APK signature: $apk"
            "$APKSIGNER" verify --verbose "$apk"
          done

      - name: Verify APK Manifest Information
        shell: bash
        env:
          EXPECTED_V_NAME: ${{ steps.resolve_version.outputs.version_name }}
          EXPECTED_V_CODE: ${{ steps.resolve_version.outputs.version_code }}
        run: |
          set -euo pipefail
          APKANALYZER="$(find "${ANDROID_HOME}/build-tools" -type f -name apkanalyzer | sort -V | tail -n1)"
          if [ -z "$APKANALYZER" ] || [ ! -x "$APKANALYZER" ]; then
            echo "::error::apkanalyzer not found or not executable"
            exit 1
          fi
          APK="$(find release-output -type f -name '*.apk' | head -n1)"
          if [ -z "$APK" ]; then
            echo "::error::No APK found in release-output for manifest verification"
            exit 1
          fi
          
          APP_ID="$("$APKANALYZER" manifest application-id "$APK")"
          V_CODE="$("$APKANALYZER" manifest version-code "$APK")"
          V_NAME="$("$APKANALYZER" manifest version-name "$APK")"
          TARGET_SDK="$("$APKANALYZER" manifest target-sdk "$APK")"

          echo "Application ID: $APP_ID"
          echo "Version Code: $V_CODE (expected $EXPECTED_V_CODE)"
          echo "Version Name: $V_NAME (expected $EXPECTED_V_NAME)"
          echo "Target SDK: $TARGET_SDK (expected 36)"

          if [ "$APP_ID" != "com.remmi.browser" ]; then
            echo "::error::Invalid application ID: $APP_ID (expected com.remmi.browser)"
            exit 1
          fi
          if [ "$V_CODE" != "$EXPECTED_V_CODE" ]; then
            echo "::error::Version code mismatch: $V_CODE (expected $EXPECTED_V_CODE)"
            exit 1
          fi
          if [ "$V_NAME" != "$EXPECTED_V_NAME" ]; then
            echo "::error::Version name mismatch: $V_NAME (expected $EXPECTED_V_NAME)"
            exit 1
          fi

      - name: Verify AAB Signature (jarsigner)
        shell: bash
        run: |
          set -euo pipefail
          for aab in release-output/*.aab; do
            echo "Verifying AAB signature: $aab"
            jarsigner -verify -verbose -certs "$aab"
          done

      - name: Final Automated Release Gate
        shell: bash
        run: |
          set -euo pipefail
          echo "=== REMMI FINAL RELEASE GATE ==="

          APK_COUNT="$(find release-output -type f -name '*.apk' | wc -l)"
          AAB_COUNT="$(find release-output -type f -name '*.aab' | wc -l)"

          test "$APK_COUNT" -ge 1
          test "$AAB_COUNT" -ge 1

          if grep -Rni --exclude-dir=.gradle --exclude-dir=build 'currentSocksPort ?: 9050' app/src/main; then
            echo "::error::Unsafe stale Tor port fallback detected in production source"
            exit 1
          fi

          if grep -Rni --exclude-dir=.gradle --exclude-dir=build '127.0.0.1:9050' app/src/main; then
            echo "::error::Hardcoded Tor SOCKS port detected in production source"
            exit 1
          fi

          if grep -Rni --exclude-dir=.gradle --exclude-dir=build 'debug.keystore' app/build.gradle.kts; then
            echo "::error::Production build still depends on debug.keystore"
            exit 1
          fi

          echo "=== REMMI FINAL RELEASE GATE PASSED ==="

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: release-output/*
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.resolve_version.outputs.release_tag }}
          name: ${{ steps.resolve_version.outputs.release_title }}
          body_path: release-notes.md
          draft: false
          prerelease: false
          files: |
            release-output/*.apk
            release-output/*.aab
            release-output/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
