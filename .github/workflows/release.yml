name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Keystore
        id: setup-keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Using production release keystore from secrets..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
            echo "KEYSTORE_PATH=${{ github.workspace }}/release.keystore" >> $GITHUB_ENV
            echo "STORE_PASSWORD=${{ secrets.STORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            echo "No production keystore found in secrets, generating self-signed release keystore..."
            keytool -genkey -v -keystore release.keystore -alias remmibrowser -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass remmibrowser -keypass remmibrowser -dname "CN=Remmi Browser, OU=Mobile, O=Remmi, L=City, S=State, C=US"
            echo "KEYSTORE_PATH=${{ github.workspace }}/release.keystore" >> $GITHUB_ENV
            echo "STORE_PASSWORD=remmibrowser" >> $GITHUB_ENV
            echo "KEY_ALIAS=remmibrowser" >> $GITHUB_ENV
            echo "KEY_PASSWORD=remmibrowser" >> $GITHUB_ENV
          fi

      - name: Build Release APK & Bundle
        run: |
          ./gradlew :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Locate Artifacts & Compute Checksums
        run: |
          mkdir -p release-output
          find app/build/outputs/apk/release/ -type f -name "*.apk" -exec cp {} release-output/ \;
          find app/build/outputs/bundle/release/ -type f -name "*.aab" -exec cp {} release-output/ \;
          cd release-output
          sha256sum * > SHA256SUMS.txt
          ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name || 'v1.0.2' }}
          name: Remmi Browser ${{ github.ref_name || 'v1.0.2' }}
          draft: false
          prerelease: false
          files: |
            release-output/*.apk
            release-output/*.aab
            release-output/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
