name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'App Version Name (e.g. 1.0.3)'
        required: true
        default: '1.0.3'
      version_code:
        description: 'App Version Code for Play Store (e.g. 4)'
        required: true
        default: '4'
      release_title:
        description: 'Release Title'
        required: false
        default: 'Remmi Browser Release'
      release_notes:
        description: 'Release Notes (Changelog)'
        required: false
        default: 'Bug fixes and performance improvements.'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Verify Toolchain (Gradle 9.3.1 & JDK 17)
        shell: bash
        run: |
          set -euo pipefail
          echo "Verifying JDK version..."
          java -version
          JAVA_VER=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | cut -d'.' -f1)
          if [ "$JAVA_VER" != "17" ]; then
            echo "::error::JDK version must be 17, but detected '$JAVA_VER'"
            exit 1
          fi

          echo "Verifying Gradle toolchain..."
          for i in 1 2 3; do
            if ./gradlew --version > /tmp/gradle_ver_out.txt 2>&1; then
              cat /tmp/gradle_ver_out.txt
              break
            fi
            echo "Attempt $i failed. Attempting resilient download from GitHub releases mirror..."
            
            # Find or trigger wrapper dist directory creation
            ./gradlew --version >/dev/null 2>&1 || true
            DIST_HASH_DIR=$(find "$HOME/.gradle/wrapper/dists/gradle-9.3.1-bin" -maxdepth 1 -mindepth 1 -type d 2>/dev/null | head -n1 || true)
            if [ -n "$DIST_HASH_DIR" ]; then
              echo "Downloading directly into $DIST_HASH_DIR..."
              curl -fSL --retry 5 --retry-delay 3 --connect-timeout 20 -o "$DIST_HASH_DIR/gradle-9.3.1-bin.zip" \
                "https://github.com/gradle/gradle-distributions/releases/download/v9.3.1/gradle-9.3.1-bin.zip" || true
            fi
            sleep 3
          done
          
          GRADLE_VER=$(cat /tmp/gradle_ver_out.txt | awk '/^Gradle / {print $2}')
          if [ "$GRADLE_VER" != "9.3.1" ]; then
            echo "::error::Gradle version must be 9.3.1, but detected '$GRADLE_VER'"
            exit 1
          fi

      - name: Validate Release Inputs & Resolve Version
        id: resolve_version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_V_NAME: ${{ inputs.version_name }}
          INPUT_V_CODE: ${{ inputs.version_code }}
          INPUT_TITLE: ${{ inputs.release_title }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if ! [[ "$INPUT_V_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Invalid versionName '$INPUT_V_NAME'. Must match pattern: ^[0-9]+\.[0-9]+\.[0-9]+$"
              exit 1
            fi
            if ! [[ "$INPUT_V_CODE" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::Invalid versionCode '$INPUT_V_CODE'. Must be a positive integer."
              exit 1
            fi

            RELEASE_TAG="v${INPUT_V_NAME}"
            VERSION_NAME="$INPUT_V_NAME"
            VERSION_CODE="$INPUT_V_CODE"
            RELEASE_TITLE="${INPUT_TITLE:-Remmi Browser Release} (v${VERSION_NAME})"
          else
            if ! [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Push tag '$REF_NAME' is invalid. Must match pattern: ^v[0-9]+\.[0-9]+\.[0-9]+$"
              exit 1
            fi

            test -f release-version.properties

            VERSION_NAME="$(grep '^versionName=' release-version.properties | cut -d'=' -f2-)"
            VERSION_CODE="$(grep '^versionCode=' release-version.properties | cut -d'=' -f2-)"

            if ! [[ "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::Invalid versionCode '$VERSION_CODE' in release-version.properties"
              exit 1
            fi

            RELEASE_TAG="$REF_NAME"
            RELEASE_TITLE="Remmi Browser ${RELEASE_TAG}"
          fi

          # Consistency check: tag must match versionName
          EXPECTED_TAG="v${VERSION_NAME}"
          if [ "$RELEASE_TAG" != "$EXPECTED_TAG" ]; then
            echo "::error::Release version mismatch: tag '$RELEASE_TAG' does not correspond to versionName '$VERSION_NAME' (expected '$EXPECTED_TAG')"
            exit 1
          fi

          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "release_title=$RELEASE_TITLE" >> "$GITHUB_OUTPUT"

      - name: Prepare Release Notes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_NOTES: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$INPUT_NOTES" ]; then
            printf '%s\n' "$INPUT_NOTES" > release-notes.md
          else
            printf 'Automated production release for %s\n' "$REF_NAME" > release-notes.md
          fi

      - name: Verify Production Signing Secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.REMMI_RELEASE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.REMMI_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.REMMI_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.REMMI_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${KEYSTORE_BASE64:-}" ] || \
             [ -z "${STORE_PASSWORD:-}" ] || \
             [ -z "${KEY_ALIAS:-}" ] || \
             [ -z "${KEY_PASSWORD:-}" ]; then

              echo "::error::Required Remmi production signing secrets are missing."
              echo "Expected:"
              echo "REMMI_RELEASE_KEYSTORE_B64"
              echo "REMMI_RELEASE_STORE_PASSWORD"
              echo "REMMI_RELEASE_KEY_ALIAS"
              echo "REMMI_RELEASE_KEY_PASSWORD"

              exit 1
          fi

      - name: Setup Keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.REMMI_RELEASE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.REMMI_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.REMMI_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.REMMI_RELEASE_KEY_PASSWORD }}
          WORKSPACE_PATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          
          clean_b64=$(printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n "'\'')
          clean_store_pass=$(printf '%s' "$STORE_PASSWORD" | tr -d '\r\n"'\''')
          clean_alias=$(printf '%s' "$KEY_ALIAS" | tr -d '\r\n "')
          clean_key_pass=$(printf '%s' "$KEY_PASSWORD" | tr -d '\r\n"'\''')

          rm -f "${WORKSPACE_PATH}/release.keystore"
          python3 - <<'EOF'
import os, base64, sys

b64 = os.environ.get("KEYSTORE_BASE64", "")
# Strip unwanted whitespace, quotes or newlines
clean_b64 = "".join(c for c in b64 if c not in ("\r", "\n", " ", '"', "'"))
out_dir = os.environ.get("WORKSPACE_PATH", ".")
out_file = os.path.join(out_dir, "release.keystore")

if not clean_b64:
    sys.exit(1)

try:
    raw = base64.b64decode(clean_b64)
    with open(out_file, "wb") as f:
        f.write(raw)
except Exception as e:
    print(f"Decode error: {e}", file=sys.stderr)
    sys.exit(1)
EOF
          
          chmod 600 "${WORKSPACE_PATH}/release.keystore"

          if [ ! -s "${WORKSPACE_PATH}/release.keystore" ]; then
            echo "::error::Failed to decode REMMI_RELEASE_KEYSTORE_B64."
            exit 1
          fi

          if ! keytool -list -keystore "${WORKSPACE_PATH}/release.keystore" -storepass "$clean_store_pass" >/dev/null 2>&1; then
            echo "::error::Could not unlock keystore with REMMI_RELEASE_STORE_PASSWORD."
            exit 1
          fi

          if ! keytool -list -keystore "${WORKSPACE_PATH}/release.keystore" -storepass "$clean_store_pass" -alias "$clean_alias" >/dev/null 2>&1; then
            echo "::error::Key alias '$clean_alias' not found in keystore."
            exit 1
          fi

          if ! keytool -certreq -keystore "${WORKSPACE_PATH}/release.keystore" -storepass "$clean_store_pass" -alias "$clean_alias" -keypass "$clean_key_pass" -file /dev/null >/dev/null 2>&1; then
            echo "::error::Could not decrypt key entry '$clean_alias' with REMMI_RELEASE_KEY_PASSWORD."
            exit 1
          fi

          echo "Keystore and signing keys verified successfully."
          echo "KEYSTORE_PATH=${WORKSPACE_PATH}/release.keystore" >> "$GITHUB_ENV"
          echo "STORE_PASSWORD=$clean_store_pass" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$clean_alias" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$clean_key_pass" >> "$GITHUB_ENV"

      - name: Run Release Checks (Tests & Lint)
        env:
          V_NAME: ${{ steps.resolve_version.outputs.version_name }}
          V_CODE: ${{ steps.resolve_version.outputs.version_code }}
        run: |
          ./gradlew \
            -PversionName="$V_NAME" \
            -PversionCode="$V_CODE" \
            :app:testDebugUnitTest \
            :app:lintRelease

      - name: Build Release APK & AAB
        env:
          V_NAME: ${{ steps.resolve_version.outputs.version_name }}
          V_CODE: ${{ steps.resolve_version.outputs.version_code }}
        run: |
          ./gradlew \
            -PversionName="$V_NAME" \
            -PversionCode="$V_CODE" \
            :app:assembleRelease \
            :app:bundleRelease \
            --stacktrace

      - name: Verify and Collect Artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-output
          
          # Copy APKs
          find app/build/outputs/apk/release/ -type f -name "*.apk" -exec cp {} release-output/ \;
          # Copy AABs (Bundle)
          find app/build/outputs/bundle/release/ -type f -name "*.aab" -exec cp {} release-output/ \;

          cd release-output
          ls -la
          
          count_apk=$(ls -1 *.apk 2>/dev/null | wc -l)
          count_aab=$(ls -1 *.aab 2>/dev/null | wc -l)
          if [ "$count_apk" -eq 0 ] || [ "$count_aab" -eq 0 ]; then
            echo "::error::Release artifacts missing! Found $count_apk APKs and $count_aab AABs"
            exit 1
          fi

      - name: Compute SHA256 Checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-output
          sha256sum *.apk *.aab > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Verify APK Signature
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKSIGNER="$(command -v apksigner 2>/dev/null || find "${SDK_ROOT}/build-tools" -name apksigner 2>/dev/null | sort -V | tail -n1 || true)"
          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            echo "::error::apksigner tool not found in $SDK_ROOT/build-tools or PATH"
            exit 1
          fi
          for apk in release-output/*.apk; do
            echo "Verifying APK signature: $apk"
            "$APKSIGNER" verify --verbose "$apk"
          done

      - name: Verify APK Manifest Information
        shell: bash
        env:
          EXPECTED_V_NAME: ${{ steps.resolve_version.outputs.version_name }}
          EXPECTED_V_CODE: ${{ steps.resolve_version.outputs.version_code }}
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKANALYZER="$(command -v apkanalyzer 2>/dev/null || find "${SDK_ROOT}/cmdline-tools" "${SDK_ROOT}" -name apkanalyzer 2>/dev/null | sort -V | tail -n1 || true)"
          if [ -z "$APKANALYZER" ] || [ ! -x "$APKANALYZER" ]; then
            echo "::error::apkanalyzer not found or not executable in $SDK_ROOT or PATH"
            exit 1
          fi
          APK="$(find release-output -type f -name '*.apk' | head -n1)"
          if [ -z "$APK" ]; then
            echo "::error::No APK found in release-output for manifest verification"
            exit 1
          fi
          
          APP_ID="$("$APKANALYZER" manifest application-id "$APK")"
          V_CODE="$("$APKANALYZER" manifest version-code "$APK")"
          V_NAME="$("$APKANALYZER" manifest version-name "$APK")"
          TARGET_SDK="$("$APKANALYZER" manifest target-sdk "$APK")"

          echo "Application ID: $APP_ID"
          echo "Version Code: $V_CODE (expected $EXPECTED_V_CODE)"
          echo "Version Name: $V_NAME (expected $EXPECTED_V_NAME)"
          echo "Target SDK: $TARGET_SDK (expected 36)"

          if [ "$APP_ID" != "com.remmi.browser" ]; then
            echo "::error::Invalid application ID: $APP_ID (expected com.remmi.browser)"
            exit 1
          fi
          if [ "$V_CODE" != "$EXPECTED_V_CODE" ]; then
            echo "::error::Version code mismatch: $V_CODE (expected $EXPECTED_V_CODE)"
            exit 1
          fi
          if [ "$V_NAME" != "$EXPECTED_V_NAME" ]; then
            echo "::error::Version name mismatch: $V_NAME (expected $EXPECTED_V_NAME)"
            exit 1
          fi

      - name: Verify AAB Signature (jarsigner)
        shell: bash
        run: |
          set -euo pipefail
          for aab in release-output/*.aab; do
            echo "Verifying AAB signature: $aab"
            jarsigner -verify -verbose -certs "$aab"
          done

      - name: Final Automated Release Gate
        shell: bash
        run: |
          set -euo pipefail
          echo "=== REMMI FINAL RELEASE GATE ==="

          APK_COUNT="$(find release-output -type f -name '*.apk' | wc -l)"
          AAB_COUNT="$(find release-output -type f -name '*.aab' | wc -l)"

          test "$APK_COUNT" -ge 1
          test "$AAB_COUNT" -ge 1

          if grep -Rni --exclude-dir=.gradle --exclude-dir=build 'currentSocksPort ?: 9050' app/src/main; then
            echo "::error::Unsafe stale Tor port fallback detected in production source"
            exit 1
          fi

          if grep -Rni --exclude-dir=.gradle --exclude-dir=build '127.0.0.1:9050' app/src/main; then
            echo "::error::Hardcoded Tor SOCKS port detected in production source"
            exit 1
          fi

          if grep -Rni --exclude-dir=.gradle --exclude-dir=build 'debug.keystore' app/build.gradle.kts; then
            echo "::error::Production build still depends on debug.keystore"
            exit 1
          fi

          echo "=== REMMI FINAL RELEASE GATE PASSED ==="

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: release-output/*
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.resolve_version.outputs.release_tag }}
          name: ${{ steps.resolve_version.outputs.release_title }}
          body_path: release-notes.md
          draft: false
          prerelease: false
          files: |
            release-output/*.apk
            release-output/*.aab
            release-output/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
