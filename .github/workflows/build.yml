name: Remmi Browser - Build CI

# Builds the APK on every push / PR and on manual runs.
#   - debug variant:  signed with a generated debug keystore, zero secrets required,
#                     ready to install right off the Actions artifact.
#   - release variant: fail-closed unless the REMMI_RELEASE_* secrets are set.
#
# Artifacts are uploaded to the run (retained 30 days). Push a `v*` tag or run
# release.yml if you want a published GitHub Release instead.

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      build_variant:
        description: 'Which variant to build (debug | release)'
        required: false
        type: choice
        default: 'debug'
        options:
          - debug
          - release

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  guard:
    name: Secret & Keystore Leak Guard
    runs-on: ubuntu-latest
    outputs:
      variant: ${{ github.event.inputs.build_variant || 'debug' }}
    steps:
      - uses: actions/checkout@v4

      - name: Fail if signing keys or live secrets are committed
        run: |
          set -uo pipefail
          FAIL=0

          echo "Scanning for committed keystores / secrets..."
          while IFS= read -r f; do
            echo "::error::Refusing to push secret file: $f"
            FAIL=1
          done < <(git ls-files | grep -iE '\.(jks|keystore|keystore\.base64|p12|pfx|bks)$' || true)

          # PEM/PKCS8 private keys and .env files in tracked sources
          if git grep -nIiE '-----BEGIN (RSA |EC |DSA |OPENSSH |)PRIVATE KEY-----' -- . >/dev/null 2>&1; then
            echo "::error::PEM private key found in tracked files:"
            git grep -nIiE '-----BEGIN (RSA |EC |DSA |OPENSSH |)PRIVATE KEY-----' -- .
            FAIL=1
          fi

          if git ls-files | grep -qE '(^|/)\.env$'; then
            echo "::error::.env file is tracked"
            FAIL=1
          fi

          # Hardcoded live credential patterns in Kotlin/Java sources (skips placeholders & tests)
          if git grep -nIE '(sk|pk|AKIA|ghp|gho|xoxb|AIza)[0-9A-Za-z_\-]{16,}' -- '*.kt' '*.java' \
             | grep -viE 'placeholder|example|sample|test|TODO|FIXME|dummy|REDACTED' \
             | grep -q .; then
            echo "::error::Possible hardcoded credential in source:"
            git grep -nIE '(sk|pk|AKIA|ghp|gho|xoxb|AIza)[0-9A-Za-z_\-]{16,}' -- '*.kt' '*.java' \
              | grep -viE 'placeholder|example|sample|test|TODO|FIXME|dummy|REDACTED'
            FAIL=1
          fi

          if [ "$FAIL" -ne 0 ]; then
            echo "::error::Secret leak guard FAILED - remove the flagged files and re-run."
            exit 1
          fi
          echo "Secret leak guard passed. No committed keystores or live secrets found."

  build:
    name: Build ${{ needs.guard.outputs.variant }} APK
    runs-on: ubuntu-latest
    needs: guard
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Generate debug signing keystore
        run: |
          set -euo pipefail
          if [ -n "${DEBUG_KEYSTORE_B64:-}" ]; then
            echo "Decoding debug keystore from secrets..."
            printf '%s' "$DEBUG_KEYSTORE_B64" | base64 -d > debug.keystore
          else
            echo "Generating fresh debug keystore..."
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug, OU=Android, O=Android, C=US"
          fi
          keytool -list -keystore debug.keystore -storepass android -alias androiddebugkey >/dev/null
          echo "Debug keystore ready."
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}

      - name: Assemble debug APK
        if: needs.guard.outputs.variant == 'debug'
        env:
          JAVA_TOOL_OPTIONS: '-Djava.awt.headless=true -Xmx4g'
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace -x test -x lint -x lintDebug

      - name: Assemble release APKs & bundle
        if: needs.guard.outputs.variant == 'release'
        env:
          JAVA_TOOL_OPTIONS: '-Djava.awt.headless=true -Xmx4g'
          KEYSTORE_PATH: ${{ secrets.REMMI_RELEASE_KEYSTORE_PATH || secrets.KEYSTORE_PATH || '' }}
          STORE_PASSWORD: ${{ secrets.REMMI_RELEASE_STORE_PASSWORD || secrets.STORE_PASSWORD || '' }}
          KEY_ALIAS: ${{ secrets.REMMI_RELEASE_KEY_ALIAS || secrets.KEY_ALIAS || '' }}
          KEY_PASSWORD: ${{ secrets.REMMI_RELEASE_KEY_PASSWORD || secrets.KEY_PASSWORD || '' }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace -x test -x lint -x lintRelease

      - name: Stage artifacts
        id: stage
        run: |
          set -uo pipefail
          mkdir -p dist
          find app/build/outputs/apk -type f -name '*.apk' -exec cp -v {} dist/ \; 2>/dev/null || true
          find app/build/outputs/bundle -type f -name '*.aab' -exec cp -v {} dist/ \; 2>/dev/null || true
          if ! ls dist/*.apk >/dev/null 2>&1; then
            echo "::error::No APK was produced"
            exit 1
          fi
          (cd dist && sha256sum *.apk *.aab 2>/dev/null | tee SHA256SUMS.txt)
          echo "=== Artifacts ==="
          ls -lh dist/
          echo "size_mb=$(du -m dist/*.apk | head -n1 | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Verify APK signatures
        run: |
          set -uo pipefail
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)
          if [ -n "$APKSIGNER" ] && [ -x "$APKSIGNER" ]; then
            for apk in dist/*.apk; do
              echo "Verifying $apk..."
              "$APKSIGNER" verify --verbose --print-certs "$apk" || true
            done
          else
            echo "apksigner not found, skipping verification."
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: remmi-browser-${{ needs.guard.outputs.variant }}-apk
          path: |
            dist/*.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload bundle
        if: needs.guard.outputs.variant == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: remmi-browser-release-bundle
          path: |
            dist/*.aab
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports-${{ needs.guard.outputs.variant }}
          path: |
            app/build/reports
            build/reports
            **/build/reports
          if-no-files-found: ignore
          retention-days: 7

      - name: Summary
        if: always()
        run: |
          echo "### Remmi Browser - ${{ needs.guard.outputs.variant }} build" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f dist/SHA256SUMS.txt ]; then
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat dist/SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "APK size: ${{ steps.stage.outputs.size_mb }} MB" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Build did not produce an APK." >> "$GITHUB_STEP_SUMMARY"
          fi
