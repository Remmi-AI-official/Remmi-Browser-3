name: Clean Repository

on:
  workflow_dispatch: # Sirf manually trigger hoga taaki galti se auto-run na ho

permissions:
  contents: write

jobs:
  wipe-repo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Delete all tracked files
        run: |
          # Saari tracked files aur folders delete karein
          git rm -rf .
          
          # Git me commit karne ke liye ek minimal README create karein
          echo "# Repository Cleaned" > README.md
          git add README.md
          
          git commit -m "Wipe: delete all repository files"
          git push origin ${{ github.ref_name }}
