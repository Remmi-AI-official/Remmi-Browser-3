name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission
        run: chmod +x ./gradlew

      - name: Verify Gradle / Java
        run: |
          java -version
          ./gradlew --version

      - name: Verify Gradle Wrapper
        shell: bash
        run: |
          grep '^distributionUrl=' gradle/wrapper/gradle-wrapper.properties

      - name: Require Production Signing Secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$KEYSTORE_BASE64" || {
            echo "ERROR: KEYSTORE_BASE64 is missing"
            exit 1
          }

          test -n "$STORE_PASSWORD" || {
            echo "ERROR: STORE_PASSWORD is missing"
            exit 1
          }

          test -n "$KEY_ALIAS" || {
            echo "ERROR: KEY_ALIAS is missing"
            exit 1
          }

          test -n "$KEY_PASSWORD" || {
            echo "ERROR: KEY_PASSWORD is missing"
            exit 1
          }

      - name: Decode Production Keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release.keystore
          chmod 600 release.keystore

      - name: Export Signing Environment
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "KEYSTORE_PATH=${{ github.workspace }}/release.keystore" >> "$GITHUB_ENV"
          echo "STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Run Release Checks
        run: |
          ./gradlew \
            :app:testReleaseUnitTest \
            :app:lintRelease

      - name: Build Release APK & AAB
        run: |
          ./gradlew \
            :app:assembleRelease \
            :app:bundleRelease \
            --stacktrace

      - name: Verify Artifacts Exist
        shell: bash
        run: |
          set -euo pipefail

          test -f app/build/outputs/apk/release/app-release.apk
          test -f app/build/outputs/bundle/release/app-release.aab

          mkdir -p release-output
          cp app/build/outputs/apk/release/*.apk release-output/
          cp app/build/outputs/bundle/release/*.aab release-output/

      - name: Compute SHA256
        shell: bash
        run: |
          set -euo pipefail
          cd release-output
          sha256sum *.apk *.aab > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Verify APK Signature
        shell: bash
        run: |
          set -euo pipefail

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)

          test -n "$APKSIGNER"

          "$APKSIGNER" verify --verbose release-output/*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Remmi Browser ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            release-output/*.apk
            release-output/*.aab
            release-output/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
